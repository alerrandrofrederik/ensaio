# The main pipeline for ensaio

resources:
  pipelines:
    ensaio_etl:
      name: ensaio_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/ensaio_etl"

      libraries:
        - glob:
            include: ../src/ensaio_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
